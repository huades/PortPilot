<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PortPilot</title>
  <link rel="stylesheet" href="popup.css">
  <style>:root{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;line-height:1.45}body{width:370px}main{padding:12px}.node-tools{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.text-button,.import{border:0;background:transparent;padding:3px 2px;font-family:inherit;font-size:12px;text-decoration:underline}.danger-text{color:#c33}.search{width:100%;margin:0 0 9px}.profile{margin-left:3px;margin-right:3px}.profile-row{grid-template-columns:1fr auto auto auto auto;gap:4px;padding:9px}.profile .action{font-family:inherit;font-size:12px}.profile-detail{padding:0 10px 9px;font-family:inherit;font-size:12px;line-height:1.55}.profile-result{padding:8px 10px;border-top:1px dashed var(--border);color:var(--muted);font-family:inherit;font-size:12px;line-height:1.5}.profile-result:empty{display:none}#profileArea.list-collapsed{display:none}form #cancelEdit{grid-column:1/-1;background:var(--surface);color:inherit}.theme-select{width:82px;padding:6px 4px;font-size:12px}#checkResult{font-family:inherit;font-size:12px}.brand span{font-family:inherit;font-size:10px}</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">P</div><div><b>PORTPILOT</b><span id="status">DIRECT</span></div></div>
    <div class="toolbar">
      <button id="language" class="icon-button" title="Language" aria-label="Language">中 / EN</button>
      <select id="themeSelect" class="theme-select" title="Theme" aria-label="Theme"></select>
      <button id="direct" data-i18n="direct">直连</button>
    </div>
  </header>
  <main>
    <section>
      <div class="heading"><h1 data-i18n="profiles">代理节点</h1><div class="node-tools"><button id="pasteImport" class="text-button" data-i18n="pasteImport">粘贴导入</button><label class="import"><span data-i18n="import">导入 JSON</span><input id="import" type="file" accept=".json,application/json,text/plain"></label><button id="toggleList" class="text-button" data-i18n="collapseList">折叠列表</button><button id="clearAll" class="text-button danger-text" data-i18n="clearAll">删除全部</button></div></div>
      <input id="profileSearch" class="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜索名称、地址、协议或标签">
      <div id="profileArea"><div id="profiles"></div></div>
      <form id="addForm">
        <input required name="name" data-i18n-placeholder="profileName" placeholder="节点名称">
        <select name="scheme" aria-label="Proxy scheme"><option>http</option><option>https</option><option>socks5</option><option>socks4</option></select>
        <input required name="host" placeholder="127.0.0.1">
        <input required name="port" type="number" min="1" max="65535" placeholder="42000">
        <button id="saveProfile" data-i18n="add">添加</button>
        <button id="cancelEdit" type="button" class="secondary" data-i18n="cancel" hidden>取消编辑</button>
      </form>
    </section>
    <section>
      <div class="heading"><h2>User-Agent</h2><button id="rotateUa" class="secondary" data-i18n="rotateUa">换一个 UA</button></div>
      <select id="uaPreset" aria-label="User-Agent preset"></select>
      <textarea id="ua" data-i18n-placeholder="uaPlaceholder" placeholder="留空以恢复浏览器默认 UA"></textarea>
      <button id="applyUa" class="wide" data-i18n="applyUa">应用 User-Agent</button>
    </section>
    <p id="checkResult" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
