name: CI
on:
  push:
  pull_request:
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension files
        run: |
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1)"
          test -f background.js
          test -f popup.js
          test -f popup.html
          test -f popup.css
          test -f icons/icon-128.png
          node --check background.js
          node --check popup.js
          grep -q 'id="pasteImport"' popup.html
          grep -q 'id="profileSearch"' popup.html
          grep -q 'id="clearAll"' popup.html
          grep -q 'id="themeSelect"' popup.html
          grep -q 'id="autoDisconnect"' popup.html
          grep -q 'data-action="edit"' popup.js
          grep -q 'listCollapsed' popup.js
          grep -q 'profile-result' popup.js
          grep -q 'proxy-health-check' background.js
          grep -q 'chrome.alarms.onAlarm' background.js
      - name: Package extension
        run: zip -r portpilot-extension.zip manifest.json background.js popup.js popup.html popup.css icons
      - uses: actions/upload-artifact@v4
        with:
          name: portpilot-extension
          path: portpilot-extension.zip
